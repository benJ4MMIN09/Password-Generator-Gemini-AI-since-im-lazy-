<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .output-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: monospace;
      font-size: 1.25rem;
      padding: 0.75rem 3rem 0.75rem 0.75rem;
      border-radius: 8px;
      outline: none;
    }

    .copy-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      border: none;
      color: #0f172a;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .setting label {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .range-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .range-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .generate-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .generate-btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Password Generator</h2>

    <div class="output-container">
      <input type="text" id="password" readonly placeholder="Click Generate" />
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>

    <div class="range-container">
      <div class="range-header">
        <label for="length">Length</label>
        <span id="lengthValue">16</span>
      </div>
      <input type="range" id="length" min="6" max="32" value="16" />
    </div>

    <div class="setting">
      <label for="uppercase">Include Uppercase (A-Z)</label>
      <input type="checkbox" id="uppercase" checked />
    </div>

    <div class="setting">
      <label for="lowercase">Include Lowercase (a-z)</label>
      <input type="checkbox" id="lowercase" checked />
    </div>

    <div class="setting">
      <label for="numbers">Include Numbers (0-9)</label>
      <input type="checkbox" id="numbers" checked />
    </div>

    <div class="setting">
      <label for="symbols">Include Symbols (!@#$...)</label>
      <input type="checkbox" id="symbols" checked />
    </div>

    <button class="generate-btn" id="generateBtn">Generate Password</button>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const copyBtn = document.getElementById('copyBtn');
    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');
    const generateBtn = document.getElementById('generateBtn');

    const charSets = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    // Sync length slider with label display
    lengthInput.addEventListener('input', (e) => {
      lengthValue.textContent = e.target.value;
    });

    // Secure random generation helper
    function getRandomChar(str) {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return str[array[0] % str.length];
    }

    function generatePassword() {
      const length = parseInt(lengthInput.value, 10);
      let allowedChars = '';
      let password = [];

      // Collect selected character pools
      if (uppercaseEl.checked) {
        allowedChars += charSets.uppercase;
        password.push(getRandomChar(charSets.uppercase));
      }
      if (lowercaseEl.checked) {
        allowedChars += charSets.lowercase;
        password.push(getRandomChar(charSets.lowercase));
      }
      if (numbersEl.checked) {
        allowedChars += charSets.numbers;
        password.push(getRandomChar(charSets.numbers));
      }
      if (symbolsEl.checked) {
        allowedChars += charSets.symbols;
        password.push(getRandomChar(charSets.symbols));
      }

      if (allowedChars === '') {
        alert('Please select at least one character set.');
        return;
      }

      // Fill the remainder of the length requirement
      while (password.length < length) {
        password.push(getRandomChar(allowedChars));
      }

      // Shuffle array to avoid predictable category placements at start
      for (let i = password.length - 1; i > 0; i--) {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        const j = array[0] % (i + 1);
        [password[i], password[j]] = [password[j], password[i]];
      }

      passwordInput.value = password.join('');
    }

    // Copy to Clipboard logic
    copyBtn.addEventListener('click', () => {
      if (!passwordInput.value) return;
      navigator.clipboard.writeText(passwordInput.value);
      
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    });

    generateBtn.addEventListener('click', generatePassword);

    // Initial run on page load
    generatePassword();
  </script>
</body>
</html>
